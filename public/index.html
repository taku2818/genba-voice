<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場ボイス - 造船現場の音声報告アプリ</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- ブロック入力強制スクリプト - main.jsの前に読み込む -->
  <script src="js/force-input.js"></script>
</head>
<body>
  <div id="app">
    <!-- ログイン画面 -->
    <div id="login-screen" class="screen">
      <div class="container">
        <h1>現場ボイス</h1>
        <div class="form-group">
          <label for="username">名前を入力</label>
          <input type="text" id="username" placeholder="名前を入力">
        </div>
        <button id="login-btn" class="primary-btn">ログイン</button>
      </div>
    </div>

    <!-- フィード画面 -->
    <div id="feed-screen" class="screen hidden">
      <div class="container">
        <header>
          <h1>現場問題報告</h1>
        </header>
        <div class="reporter-section">
          <label for="reporter">報告者</label>
          <div id="reporter" class="info-display"></div>
        </div>
        
        <div class="ship-section">
          <label for="ship-select">shipナンバー</label>
          <div class="recent-ships">
            <div id="recent-ships-container"></div>
            <input type="text" id="ship-input" placeholder="手動入力">
          </div>
        </div>

        <div class="image-section">
          <label for="imageInput">画像添付</label>
          <div class="image-input-container">
            <input type="file" id="imageInput" accept="image/*" capture="environment">
            <div class="image-preview-container">
              <img id="imagePreview" src="#" alt="画像プレビュー" style="max-width: 100%; max-height: 200px; margin-top: 10px; display: none;"/>
            </div>
          </div>
        </div>

        <div class="record-section">
          <button id="record-btn" class="action-btn">
            <i class="fas fa-microphone"></i> 音声報告開始
          </button>
          <div id="status" class="status"></div>
          <!-- 音声はテキスト化されるのみで再生機能は不要 -->
          <div id="statusMessage" class="status-message"></div>
        </div>

        <div id="report-container">
          <div class="report-section">
            <h3>音声報告方法</h3>
            <p><strong>ブロック名は○○○です、と最初に述べてから、不具合点を具体的に報告してください。</strong></p>
            <p>例: 「ブロック名はB5です。配管のサポートが外れており、接続部が破損しています」</p>
          </div>

          <div class="result-section">
            <div class="form-group">
              <label for="block-input">ブロック</label>
              <div id="block-candidate" class="block-candidate"></div>
              <input type="text" id="block-input" placeholder="ブロック名">
            </div>
            
            <div class="form-group">
              <label for="summary">不具合内容</label>
              <textarea id="summary"></textarea>
            </div>

            <div class="action-buttons">
              <button id="submit-btn" class="primary-btn">確定</button>
              <button id="cancel-btn" class="secondary-btn">キャンセル</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- レコード画面（詳細表示） -->
    <div id="record-detail-screen" class="screen hidden">
      <div class="container">
        <header>
          <button id="back-btn" class="icon-btn"><i class="fas fa-arrow-left"></i></button>
          <h1>レコード</h1>
        </header>
        
        <div class="detail-grid">
          <div class="detail-row">
            <div class="detail-label">発生日</div>
            <div id="record-date" class="detail-value"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">報告者</div>
            <div id="record-reporter" class="detail-value"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">shipNO</div>
            <div id="record-ship" class="detail-value"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">ブロック</div>
            <div id="record-block" class="detail-value"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">内容</div>
            <div id="record-content" class="detail-value"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">原因</div>
            <div id="record-cause" class="detail-value"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">対応状況</div>
            <div id="record-status" class="detail-value"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">担当者</div>
            <div id="record-assigned" class="detail-value"></div>
          </div>
        </div>
        
        <div class="detail-actions">
          <button id="edit-btn" class="primary-btn">編集</button>
        </div>
      </div>
    </div>
  </div>

  <!-- キャッシュを完全に無効化して直接スクリプトを読み込む -->
  <!-- API設定スクリプト -->
  <script src="js/api-config.js?v=20250419-2220"></script>
  
  <!-- 直接入力制御ユーティリティ - 他のスクリプトの前に読み込まれる必要があります -->
  <script src="js/direct-input.js?v=20250419-2220"></script>
  
  <!-- ログイン機能と画面遷移用スクリプト -->
  <script src="js/app.js?v=20250420-0031"></script>
  
  <!-- 音声認識とブロック名抽出用スクリプト -->
  <script src="js/main.js?v=20250419-2220"></script>
  
  <div id="debug-controls" style="position: fixed; bottom: 10px; left: 10px; background-color: white; border: 1px solid black; padding: 5px; z-index: 99999; display: none;">
    <div style="margin-bottom: 5px; font-weight: bold;">デバッグコントロール</div>
    <button id="debug-set-block" style="margin-right: 5px;">S5を設定</button>
    <button id="debug-set-both">S5+テキスト設定</button>
    <div style="font-size: 10px; margin-top: 5px;">■ 開発検証用 ■</div>
  </div>

  <script>
    // スクリプトロード確認
    console.log('【確認】全てのスクリプトが直接読み込まれました');
    
    // 直接全変数を定義
    window.addEventListener('DOMContentLoaded', function() {
      console.log('ページが完全に読み込まれました');
      console.log('APIオブジェクトの確認:', typeof window.API);
      
      // デバッグコントロールの機能設定
      const debugControls = document.getElementById('debug-controls');
      if (debugControls) {
        // Ctrl+Shift+Dでデバッグコントロールを表示
        document.addEventListener('keydown', function(e) {
          if (e.ctrlKey && e.shiftKey && e.key === 'D') {
            debugControls.style.display = debugControls.style.display === 'none' ? 'block' : 'none';
          }
        });
        
        // S5設定ボタン
        document.getElementById('debug-set-block').addEventListener('click', function() {
          if (window.DirectInput) {
            window.DirectInput.setBlockValue('S5');
            console.log('S5をブロック欄に設定しました');
          } else {
            console.error('DirectInputユーティリティが利用できません');
          }
        });
        
        // 両方設定ボタン
        document.getElementById('debug-set-both').addEventListener('click', function() {
          if (window.DirectInput) {
            window.DirectInput.setBlockValue('S5');
            window.DirectInput.setSummaryText('配管のサポートが外れています');
            console.log('ブロック名と要約テキストを設定しました');
          } else {
            console.error('DirectInputユーティリティが利用できません');
          }
        });
      }
    });
  </script>
</body>
</html>
